name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Site checks (sections, hint, CSP-safe markup, links, game content)
        run: node scripts/check-site.js

      - name: Game logic tests
        run: node --test tests/engine.test.js

      - name: Leaderboard Lambda tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Lint CloudFormation templates
        run: |
          pip install cfn-lint
          cfn-lint infra/template.yaml infra/budget.yaml

  lighthouse:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse (mobile) on the static site
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
