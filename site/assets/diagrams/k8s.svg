<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif"><title id="t">Kubernetes microservices with monitoring and autoscaling</title><desc id="d">Users reach services through Ingress. A horizontal pod autoscaler adjusts replicas. Prometheus scrapes metrics and feeds Grafana dashboards and alerting rules.</desc><rect width="640" height="360" fill="#FFFFFF"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F1A2B"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D3232F"/></marker></defs><rect x="10" y="128" width="90" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="55.0" y="153.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">Users</text><text x="55.0" y="171.0" text-anchor="middle" font-size="12.5" fill="#4A586B">traffic</text><rect x="124" y="128" width="96" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="172.0" y="153.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">Ingress</text><text x="172.0" y="171.0" text-anchor="middle" font-size="12.5" fill="#4A586B">routes traffic</text><line x1="100" y1="156" x2="122" y2="156" stroke="#0F1A2B" stroke-width="1.5" marker-end="url(#ak)"/><rect x="244" y="48" width="386" height="190" rx="4" fill="none" stroke="#8C97A6" stroke-width="1.25" stroke-dasharray="5 4"/><text x="258" y="68" font-size="12.5" font-weight="700" fill="#4A586B">Kubernetes cluster, deployed with Helm</text><rect x="262" y="80" width="106" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="315.0" y="105.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">Service A</text><text x="315.0" y="123.0" text-anchor="middle" font-size="12.5" fill="#4A586B">pods</text><rect x="380" y="80" width="106" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="433.0" y="105.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">Service B</text><text x="433.0" y="123.0" text-anchor="middle" font-size="12.5" fill="#4A586B">pods</text><rect x="498" y="80" width="106" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="551.0" y="105.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">Service C</text><text x="551.0" y="123.0" text-anchor="middle" font-size="12.5" fill="#4A586B">pods</text><line x1="220" y1="156" x2="242" y2="156" stroke="#0F1A2B" stroke-width="1.5" marker-end="url(#ak)"/><rect x="262" y="170" width="342" height="48" rx="4" fill="#FBE9EA" stroke="#D3232F" stroke-width="2"/><text x="433.0" y="191.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">Horizontal Pod Autoscaler</text><text x="433.0" y="209.0" text-anchor="middle" font-size="12.5" fill="#4A586B">adds or removes pods with load</text><line x1="433" y1="170" x2="433" y2="138" stroke="#D3232F" stroke-width="1.5" marker-end="url(#ar)"/><rect x="244" y="280" width="190" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="339.0" y="305.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">Prometheus</text><text x="339.0" y="323.0" text-anchor="middle" font-size="12.5" fill="#4A586B">scrapes, alert rules</text><rect x="466" y="280" width="164" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="548.0" y="305.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">Grafana</text><text x="548.0" y="323.0" text-anchor="middle" font-size="12.5" fill="#4A586B">SLI and SLO dashboards</text><line x1="340" y1="238" x2="340" y2="278" stroke="#0F1A2B" stroke-width="1.5" marker-end="url(#ak)"/><line x1="434" 