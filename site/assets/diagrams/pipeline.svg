<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif"><title id="t">Secure DevSecOps pipeline</title><desc id="d">A commit triggers a build, SAST, DAST and a compliance gate before deployment to EC2, with IAM, encrypted S3 and CloudTrail around it.</desc><rect width="640" height="360" fill="#FFFFFF"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F1A2B"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D3232F"/></marker></defs><rect x="10" y="34" width="100" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="60.0" y="59.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">GitHub</text><text x="60.0" y="77.0" text-anchor="middle" font-size="12.5" fill="#4A586B">commit</text><rect x="138" y="34" width="100" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="188.0" y="59.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">Build</text><text x="188.0" y="77.0" text-anchor="middle" font-size="12.5" fill="#4A586B">Docker image</text><rect x="266" y="34" width="100" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="316.0" y="59.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">SAST</text><text x="316.0" y="77.0" text-anchor="middle" font-size="12.5" fill="#4A586B">code scan</text><rect x="394" y="34" width="100" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="444.0" y="59.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">DAST</text><text x="444.0" y="77.0" text-anchor="middle" font-size="12.5" fill="#4A586B">running app</text><rect x="522" y="34" width="100" height="56" rx="4" fill="#FBE9EA" stroke="#D3232F" stroke-width="2"/><text x="572.0" y="59.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">Gate</text><text x="572.0" y="77.0" text-anchor="middle" font-size="12.5" fill="#4A586B">compliance</text><line x1="110" y1="62" x2="136" y2="62" stroke="#0F1A2B" stroke-width="1.5" marker-end="url(#ak)"/><line x1="238" y1="62" x2="264" y2="62" stroke="#0F1A2B" stroke-width="1.5" marker-end="url(#ak)"/><line x1="366" y1="62" x2="392" y2="62" stroke="#0F1A2B" stroke-width="1.5" marker-end="url(#ak)"/><line x1="494" y1="62" x2="520" y2="62" stroke="#D3232F" stroke-width="1.5" marker-end="url(#ar)"/><rect x="502" y="150" width="120" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="562.0" y="175.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">Deploy</text><text x="562.0" y="193.0" text-anchor="middle" font-size="12.5" fill="#4A586B">AWS EC2</text><line x1="572" y1="90" x2="572" y2="148" stroke="#D3232F" stroke-width="1.5" marker-end="url(#ar)"/><rect x="10" y="232" width="612" height="108" rx="4" fill="none" stroke="#8C97A6" stroke-width="1.25" stroke-dasharray="5 4"/><text x="24" y="252" font-size="12.5" font-weight="700" fill="#4A586B">Around the deployment</text><rect x="24" y="268" width="184" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="116.0" y="293.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">IAM roles</text><text x="116.0" y="311.0" text-anchor="middle" font-size="12.5" fill="#4A586B">least privilege</text><rect x="224" y="268" width="184" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="316.0" y="293.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">S3 storage</text><text x="316.0" y="311.0" text-anchor="middle" font-size="12.5" fill="#4A586B">encrypted</text><rect x="424" y="268" width="184" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="516.0" y="293.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">Monitoring</text><text x="516.0" y="311.0" text-anchor="middle" font-size="12.5" fill="#4A586B">CloudTrail, CloudWatch</text><line x1="562" y1="206" x2="562" y2="230" stroke="#0F1A2B" stroke-width="1.5" marker-end="url(#ak)"/></svg>
