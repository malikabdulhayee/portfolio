<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif"><title id="t">AI DevOps job matcher</title><desc id="d">EventBridge triggers a collector Lambda that searches the web and scores postings, then stores matches in DynamoDB. A second Lambda behind API Gateway serves a dashboard on S3.</desc><rect width="640" height="360" fill="#FFFFFF"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F1A2B"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D3232F"/></marker></defs><rect x="10" y="36" width="140" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="80.0" y="61.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">EventBridge</text><text x="80.0" y="79.0" text-anchor="middle" font-size="12.5" fill="#4A586B">every 6 hours</text><rect x="170" y="36" width="140" height="56" rx="4" fill="#FBE9EA" stroke="#D3232F" stroke-width="2"/><text x="240.0" y="61.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">Lambda</text><text x="240.0" y="79.0" text-anchor="middle" font-size="12.5" fill="#4A586B">collector</text><rect x="330" y="36" width="140" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="400.0" y="61.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">Search and AI</text><text x="400.0" y="79.0" text-anchor="middle" font-size="12.5" fill="#4A586B">find and score jobs</text><line x1="150" y1="64" x2="168" y2="64" stroke="#0F1A2B" stroke-width="1.5" marker-end="url(#ak)"/><line x1="310" y1="64" x2="328" y2="64" stroke="#0F1A2B" stroke-width="1.5" marker-end="url(#ak)"/><rect x="170" y="156" width="140" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="240.0" y="181.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">DynamoDB</text><text x="240.0" y="199.0" text-anchor="middle" font-size="12.5" fill="#4A586B">matches, 2-day TTL</text><line x1="240.0" y1="92" x2="240.0" y2="154" stroke="#0F1A2B" stroke-width="1.5" marker-end="url(#ak)"/><rect x="330" y="156" width="140" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="400.0" y="181.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">Lambda</text><text x="400.0" y="199.0" text-anchor="middle" font-size="12.5" fill="#4A586B">get-matched-jobs</text><line x1="330" y1="184" x2="312" y2="184" stroke="#0F1A2B" stroke-width="1.5" marker-end="url(#ak)"/><rect x="490" y="156" width="140" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="560.0" y="181.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">API Gateway</text><text x="560.0" y="199.0" text-anchor="middle" font-size="12.5" fill="#4A586B">HTTPS endpoint</text><line x1="490" y1="184" x2="472" y2="184" stroke="#0F1A2B" stroke-width="1.5" marker-end="url(#ak)"/><rect x="490" y="276" width="140" height="56" rx="4" fill="#FFFFFF" stroke="#0F1A2B" stroke-width="1.25"/><text x="560.0" y="301.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1A2B">Dashboard</text><text x="560.0" y="319.0" text-anchor="middle" font-size="12.5" fill="#4A586B">static site on S3</text><line x1="560.0" y1="276" x2="560.0" y2="214" stroke="#0F1A2B" stroke-width="1.5" marker-end="url(#ak)"/></svg>
