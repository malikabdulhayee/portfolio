AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Audit Me leaderboard (Layer 2). API Gateway HTTP API, Lambda, DynamoDB, CloudWatch.

Parameters:
  ProjectName:
    Type: String
    Default: audit-me
    AllowedPattern: '^[a-z0-9-]{3,30}$'
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Origin allowed to call the API, for example https://main.d1abc2defg3.amplifyapp.com (no trailing slash). Set this once the Amplify URL exists.
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional. Email for the error alarm.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  LeaderboardTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-leaderboard'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: board
          AttributeType: S
        - AttributeName: rank_key
          AttributeType: S
      KeySchema:
        - AttributeName: board
          KeyType: HASH
        - AttributeName: rank_key
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-api'
      RetentionInDays: 14

  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-api'
      CodeUri: lambda/
      Handler: app.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 5
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          TABLE_NAME: !Ref LeaderboardTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Query
              Resource: !GetAtt LeaderboardTable.Arn
      Events:
        PostScore:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /score
            Method: POST
        GetLeaderboard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /leaderboard
            Method: GET

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-api-errors'
      AlarmDescription: The leaderboard function returned errors. The game still works without it.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If [HasAlertEmail, !Ref AlertTopic, !Ref 'AWS::NoValue']

Outputs:
  ApiUrl:
    Description: Paste this into site/js/config.js as apiUrl, and match the region in customHttp.yml.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  TableName:
    Value: !Ref LeaderboardTable
